<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrewCalc — testes</title>
<style>
    body {
        margin: 0; padding: 24px; background: #1b1410; color: #f3e9dd;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
    }
    h1 { font-family: ui-serif, Georgia, serif; font-size: 22px; margin: 0 0 4px; }
    .sub { color: #a08b76; margin-bottom: 20px; font-size: 13px; }
    #placar { padding: 14px 16px; border-radius: 14px; font-weight: 700; margin-bottom: 18px; font-size: 16px; }
    .verde { background: rgba(124, 174, 111, 0.18); color: #9ed492; border: 1px solid #7cae6f; }
    .vermelho { background: rgba(224, 102, 74, 0.18); color: #ef8468; border: 1px solid #e0664a; }
    .grupo { margin-bottom: 6px; color: #e8be6e; font-weight: 700; margin-top: 16px; }
    .falha { color: #ef8468; padding-left: 14px; line-height: 1.5; }
    .resumo-grupo { color: #a08b76; padding-left: 14px; }
    pre { background: #221913; padding: 12px 14px; border-radius: 10px; color: #d8c6b3; overflow-x: auto; }
    iframe { display: none; }
</style>
</head>
<body>
<h1>BrewCalc — testes</h1>
<p class="sub">Carrega o <code>index.html</code> real num iframe e exercita as regras de cálculo. Precisa ser servido por http(s) — abrir por <code>file://</code> bloqueia o acesso ao iframe.</p>
<div id="placar">Carregando index.html…</div>
<div id="saida"></div>
<iframe id="app" src="index.html"></iframe>

<script>
let ok = 0, fail = 0, grupoAtual = '', falhasDoGrupo = [], testesDoGrupo = 0;
const saida = document.getElementById('saida');

function grupo(nome) {
    fecharGrupo();
    grupoAtual = nome;
    falhasDoGrupo = [];
    testesDoGrupo = 0;
}

function fecharGrupo() {
    if (!grupoAtual) return;
    const el = document.createElement('div');
    el.className = 'grupo';
    el.textContent = (falhasDoGrupo.length === 0 ? '✓ ' : '✗ ') + grupoAtual + ` (${testesDoGrupo})`;
    saida.appendChild(el);
    falhasDoGrupo.forEach(f => {
        const d = document.createElement('div');
        d.className = 'falha';
        d.textContent = '↳ ' + f;
        saida.appendChild(d);
    });
}

function t(nome, cond, detalhe) {
    testesDoGrupo++;
    if (cond) { ok++; } else { fail++; falhasDoGrupo.push(nome + (detalhe ? ' :: ' + detalhe : '')); }
}

function mostrar(texto) {
    const pre = document.createElement('pre');
    pre.textContent = texto;
    saida.appendChild(pre);
}

document.getElementById('app').addEventListener('load', () => {
    const w = document.getElementById('app').contentWindow;
    // O app é um módulo ES, cujo escopo não é alcançável de fora. O contrato de teste
    // é o window.BrewCalc que ele declara de propósito no final do index.html.
    const API = w.BrewCalc;
    if (!API) {
        document.getElementById('placar').className = 'vermelho';
        document.getElementById('placar').textContent =
            'window.BrewCalc não existe — o app não carregou. Confira o console do iframe; '
            + 'módulo ES exige http(s), não abre por file://';
        return;
    }
    rodar(API);
});

function rodar(A) {
    const todasReceitas = () => {
        const out = [];
        for (const dk of Object.keys(A.deviceData))
            for (const rk of Object.keys(A.deviceData[dk].recipes))
                out.push([dk, rk, A.deviceData[dk].recipes[rk]]);
        return out;
    };

    // ---------- Fidelidade: os despejos somam o alvo final ----------
    grupo('Soma dos despejos fecha no alvo, em toda receita e volume');
    for (const [dk, rk, receita] of todasReceitas()) {
        for (const water of [150, 200, 250, 300, 320, 333, 400, 500, 1000]) {
            const coffee = water / receita.ratio;
            const combos = receita.hasKasuyaControls
                ? [[1,1],[1,4],[2,2],[3,1],[3,2],[3,3],[3,4],[4,3],[5,1],[5,4]]
                : [[null, null]];
            for (const [bal, str] of combos) {
                const steps = A.renderRecipeSteps(receita.buildSteps(coffee, water, bal, str), coffee, water);
                const despejos = steps.filter(s => s.pour !== undefined);
                if (!despejos.length) continue;
                const soma = despejos.reduce((a, s) => a + s.pour, 0);
                const alvoFinal = despejos[despejos.length - 1].target;
                const rot = `${dk}/${rk} água=${water}${bal ? ` bal=${bal} força=${str}` : ''}`;
                t(`soma==alvo ${rot}`, soma === alvoFinal, `soma=${soma} alvo=${alvoFinal}`);
                let acc = 0, coerente = true;
                despejos.forEach(d => { acc += d.pour; if (acc !== d.target) coerente = false; });
                t(`alvos coerentes ${rot}`, coerente);
                t(`despejos não-negativos ${rot}`, despejos.every(d => d.pour >= 0));
                t(`alvo final == água ${rot}`, alvoFinal === Math.round(water), `alvo=${alvoFinal}`);
            }
        }
    }

    // O caso concreto que motivou a correção
    {
        const k = A.deviceData.v60.recipes.kasuya;
        const steps = A.renderRecipeSteps(k.buildSteps(250 / 15, 250, 3, 4), 250 / 15, 250);
        const d = steps.filter(s => s.pour !== undefined);
        const soma = d.reduce((a, s) => a + s.pour, 0);
        t('caso 250ml com 4 despejos soma 250g', soma === 250, `soma=${soma}`);
        mostrar('Kasuya · 250ml · equilibrado · 4 despejos de força\n' +
            d.map(s => `  despeje ${s.pour}g   →   alvo ${s.target}g`).join('\n') +
            `\n  soma dos despejos = ${soma}g`);
    }

    // ---------- Proporção ----------
    grupo('Proporção mantém o decimal e bate com a dose de referência');
    t('16.666… → 16.7', A.formatRatio(500 / 30) === '16.7', A.formatRatio(500 / 30));
    t('15 → 15 (sem .0)', A.formatRatio(15) === '15');
    t('380/24 → 15.8', A.formatRatio(380 / 24) === '15.8');
    t('200/11 → 18.2', A.formatRatio(200 / 11) === '18.2');
    t('200/18 → 11.1', A.formatRatio(200 / 18) === '11.1');
    for (const [dk, rk, r] of todasReceitas()) {
        if (!r.refDose) continue;
        t(`ratio == refDose ${dk}/${rk}`, Math.abs(r.ratio - r.refDose.water / r.refDose.coffee) < 1e-9);
    }

    grupo('Dose original do autor não se corrompe ao navegar');
    {
        // Regressão: getActiveRatio lia o valor EXIBIDO no campo (16.7) em vez da razão
        // exata da receita (16,6667), então a dose 30g/500ml do Hoffmann virava
        // 30g/501ml só de trocar de aparelho e voltar.
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        d.getElementById('device').value = 'v60'; w.BrewCalc.onDeviceChange();
        const antes = d.getElementById('water').value;
        ['chemex', 'kalita', 'aeropress', 'v60'].forEach(dev => {
            d.getElementById('device').value = dev; w.BrewCalc.onDeviceChange();
        });
        const depois = d.getElementById('water').value;
        t('água não muda ao ir e voltar de aparelho', antes === depois, `${antes} → ${depois}`);
        const cafe = parseFloat(d.getElementById('coffee').value);
        const exato = A.deviceData.v60.recipes.hoffmann.ratio;
        t('água == café × razão exata (não a exibida)', Math.abs(parseFloat(depois) - cafe * exato) < 0.5,
          `água=${depois} café=${cafe}`);
        t('dose do Hoffmann continua 30g/500ml', cafe === 30 && parseFloat(depois) === 500,
          `${cafe}g / ${depois}ml`);
    }

    grupo('Limites dos campos são respeitados');
    t('acima do max trava', A.clampToInput({ min: '5', max: '35' }, 99) === 35);
    t('abaixo do min trava', A.clampToInput({ min: '5', max: '35' }, 1) === 5);
    t('valor válido passa', A.clampToInput({ min: '5', max: '35' }, 20) === 20);
    t('sem max não trava', A.clampToInput({ min: '0', max: '' }, 1e6) === 1e6);

    // ---------- Temperatura ----------
    grupo('Temperatura preserva a faixa do autor e marca o que é ajuste do app');
    {
        const med = A.getRecipeTemp(A.deviceData.aeropress.recipes.hoffmann, 'medium');
        t('faixa 90–95 preservada', med.label === '90–95°C', med.label);
        t('faixa não é ajuste do app', med.adjusted === false);
        const kas = A.getRecipeTemp(A.deviceData.v60.recipes.kasuya, 'dark');
        t('temp por torra do autor', kas.value === 83 && kas.adjusted === false);
        t('ajuste por torra é marcado', A.getRecipeTemp(A.deviceData.v60.recipes.hoffmann, 'light').adjusted === true);
        t('temp base não é marcada como ajuste', A.getRecipeTemp(A.deviceData.v60.recipes.hoffmann, 'medium').adjusted === false);
    }

    // ---------- Segurança ----------
    grupo('escapeHtml neutraliza injeção');
    {
        const e = A.escapeHtml('<img src=x onerror="alert(1)">');
        t('sem <', !e.includes('<'));
        t('sem aspas duplas', !e.includes('"'));
        t('sem aspas simples', !A.escapeHtml("' onmouseover='x").includes("'"));
    }

    grupo('Importação por link rejeita payloads malformados');
    {
        const enc = o => A.toBase64Url(JSON.stringify(o));
        const bom = { n: 'Teste', dv: 'v60', rc: 20, rw: 320, ck: 18, tc: 93,
                      st: [[0, 50, 'Bloom'], [45, 320, 'Final']] };
        let passou = true;
        try { A.decodeRecipeFromParam(enc(bom)); } catch (e) { passou = false; }
        t('aceita payload válido', passou);

        const ruins = {
            'nome vazio': { n: '' }, 'nome gigante': { n: 'x'.repeat(200) },
            'nome não-string': { n: { a: 1 } }, 'sem passos': { st: [] },
            'passos demais': { st: Array(50).fill([0, 10, 'a']) }, 'st não-array': { st: 'nope' },
            'água zero': { rw: 0 }, 'café negativo': { rc: -5 }, 'temp absurda': { tc: 9999 },
            'cliques absurdos': { ck: 1e9 },
            'quantidade não numérica': { st: [[0, 'abc', 'Bloom']] },
            'descrição vazia': { st: [[0, 50, '']] },
            'descrição gigante': { st: [[0, 50, 'y'.repeat(200)]] },
            'passo incompleto': { st: [[0, 50]] },
            'tempo negativo': { st: [[-10, 50, 'Bloom']] },
        };
        for (const nome of Object.keys(ruins)) {
            let rejeitou = false;
            try { A.decodeRecipeFromParam(enc(Object.assign({}, bom, ruins[nome]))); }
            catch (e) { rejeitou = true; }
            t(`rejeita: ${nome}`, rejeitou);
        }
        // O payload de XSS real: se for aceito, precisa sair escapado, nunca como HTML vivo
        let dadosXss = null;
        try { dadosXss = A.decodeRecipeFromParam(enc(Object.assign({}, bom, { n: '<img src=x onerror=alert(1)>' }))); } catch (e) { /* rejeitado, ótimo */ }
        t('payload XSS rejeitado ou escapável', dadosXss === null || !A.escapeHtml(dadosXss.name).includes('<'));
    }

    // ---------- Compartilhamento ----------
    grupo('Link de compartilhamento é exato ao reescalar');
    {
        const data = { id: 'x', device: 'v60', name: 'Meu método', refCoffee: 20, refWater: 320,
                       clicksDefault: 18, tempC: 93,
                       steps: [{ time: '0:00', amount: 50, desc: 'Bloom' },
                               { time: '0:45', amount: 320, desc: 'Final' }] };
        const volta = A.decodeRecipeFromParam(A.buildRecipeShareUrl(data).param);
        t('nome sobrevive', volta.name === data.name);
        t('água de referência sobrevive', volta.refWater === 320);
        t('quantidade exata sobrevive', volta.steps[0].amount === 50, String(volta.steps[0].amount));
        const escalado = Math.round(400 * (volta.steps[0].amount / volta.refWater));
        t('50g/320ml reescalado a 400ml dá 63g (não 62)', escalado === 63, `deu ${escalado}`);
        t('tempos sobrevivem', volta.steps[1].time === '0:45', volta.steps[1].time);
    }

    grupo('Migração do formato antigo salvo no navegador');
    {
        const novo = A.normalizeCustomRecipe({ refWater: 320, steps: [{ time: '0:00', pct: 0.15625, desc: 'Bloom' }] });
        t('pct vira gramas absolutos', novo.steps[0].amount === 50, String(novo.steps[0].amount));
    }

    grupo('Meta em gramas é opcional no passo customizado');
    {
        // Regressão: o commit 2c4d23a reverteu em silêncio a meta opcional, exigindo
        // gramas em todo passo — inclusive nos que são só instrução ("aguarde a drenagem").
        t('temMeta aceita número positivo', A.temMeta(50) === true);
        t('temMeta rejeita null', A.temMeta(null) === false);
        t('temMeta rejeita zero', A.temMeta(0) === false);
        t('temMeta rejeita texto', A.temMeta('50') === false);

        const receita = {
            id: 'x', device: 'v60', name: 'Com instrução', refCoffee: 20, refWater: 320,
            clicksDefault: 18, tempC: 93,
            steps: [{ time: '0:00', amount: 50, desc: 'Bloom' },
                    { time: '0:45', amount: 320, desc: 'Despejo final' },
                    { time: '2:00', amount: null, desc: 'Aguarde a drenagem' }]
        };
        const obj = A.buildCustomRecipeObject(receita);
        const passos = A.renderRecipeSteps(obj.buildSteps(20, 320), 20, 320);
        t('passo sem meta não vira despejo', passos[2].pour === undefined, JSON.stringify(passos[2]));
        t('passo sem meta mantém a descrição', /Aguarde a drenagem/.test(passos[2].desc), passos[2].desc);
        t('passos com meta seguem somando o alvo',
            passos[0].pour + passos[1].pour === passos[1].target,
            `${passos[0].pour}+${passos[1].pour} vs ${passos[1].target}`);

        // Migração do formato antigo: pct null virava meta obrigatória
        const migrado = A.normalizeCustomRecipe({
            refWater: 320,
            steps: [{ time: '0:00', pct: 0.15625, desc: 'Bloom' }, { time: '2:00', pct: null, desc: 'Aguarde' }]
        });
        t('migração preserva passo sem meta', migrado.steps[1].amount === null, String(migrado.steps[1].amount));
        t('migração converte passo com meta', migrado.steps[0].amount === 50, String(migrado.steps[0].amount));
    }

    grupo('QR comporta receitas de tamanho realista');
    {
        // Regressão: o gerador parava na versão 10 (271 bytes) e falhava a partir de
        // 4 passos — ou seja, em qualquer receita de verdade.
        const receita = n => ({
            id: 'x', device: 'v60', name: 'Receita de domingo de manhã', refCoffee: 20, refWater: 320,
            clicksDefault: 18, tempC: 93,
            steps: Array.from({ length: n }, (_, i) => ({
                time: `${i}:00`, amount: 50 + i * 45, desc: `Despejo número ${i + 1} em espiral`
            }))
        });
        for (const n of [3, 4, 6, 8]) {
            const { url } = A.buildRecipeShareUrl(receita(n));
            t(`receita de ${n} passos gera QR (${url.length} bytes)`, !!A.generateRecipeQR(url));
        }
        // Ida e volta pelo link continua exata
        const { url } = A.buildRecipeShareUrl(receita(6));
        const volta = A.decodeRecipeFromParam(url.split('#r=')[1]);
        t('receita de 6 passos volta íntegra do link', volta.steps.length === 6 && volta.steps[0].amount === 50);
    }

    // ---------- Ligação dos controles ----------
    // Antes os handlers eram onclick inline, que não dá para enumerar: errar o nome de
    // uma função deixava o botão morto sem nenhum teste reclamar. Com o mapa ACOES dá
    // para varrer todo controle declarado no HTML e conferir que ele resolve.
    grupo('Todo controle do HTML resolve para uma função');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const controles = d.querySelectorAll('[data-acao], [data-entrada], [data-mudanca]');
        // Um mesmo elemento pode declarar mais de uma ação — #ratio-input reage a input
        // e a change com funções diferentes — então são todos os atributos, não o primeiro.
        const acoesDe = el => [el.dataset.acao, el.dataset.entrada, el.dataset.mudanca].filter(Boolean);
        t('o HTML declara controles', controles.length >= 40, `achei ${controles.length}`);
        controles.forEach(el => acoesDe(el).forEach(nome => {
            t(`ação "${nome}" existe`, typeof w.BrewCalc.ACOES[nome] === 'function');
        }));
        // O caminho inverso: ação no mapa sem nenhum controle no HTML é código morto,
        // ou pior, sinal de que alguém renomeou o atributo e esqueceu do mapa.
        const usados = new Set(Array.from(controles).flatMap(acoesDe));
        Object.keys(w.BrewCalc.ACOES).forEach(nome => {
            // avaliacaoNota e removerPasso vivem em elementos criados em runtime
            if (nome === 'avaliacaoNota' || nome === 'removerPasso') return;
            t(`ação "${nome}" é usada por algum controle`, usados.has(nome));
        });
        t('sobrou onclick inline no HTML', !/\son(click|input|change)=/.test(d.documentElement.outerHTML));
    }

    // Resolver o nome no mapa não prova que o clique chega lá: a delegação em si pode
    // estar quebrada (listener não registrado, closest errado, evento que não borbulha).
    // Estes clicam de verdade e conferem o efeito no DOM.
    grupo('Clique de verdade atravessa a delegação');
    {
        const d = document.getElementById('app').contentDocument;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new d.defaultView.MouseEvent('click', { bubbles: true }));

        const agua = d.getElementById('water');
        const antes = parseFloat(agua.value);
        clicar('aguaMais');
        t('clique em + soma 10ml', parseFloat(agua.value) === antes + 10, `${antes} → ${agua.value}`);
        clicar('aguaMenos');
        t('clique em − devolve ao valor original', parseFloat(agua.value) === antes, agua.value);

        clicar('abaAvaliacao');
        t('clique troca para a aba de avaliação',
            d.getElementById('tab-btn-review').getAttribute('aria-selected') === 'true');
        clicar('abaCalculadora');
        t('clique volta para a calculadora',
            d.getElementById('tab-btn-calc').getAttribute('aria-selected') === 'true');

        // O botão tem um <span> dentro em alguns temas; o clique nasce no filho e só
        // chega à ação via closest. Cobre justamente esse caminho.
        const alvoFilho = d.querySelector('[data-acao="aguaMais"]').firstChild;
        if (alvoFilho && alvoFilho.nodeType === 1) {
            alvoFilho.dispatchEvent(new d.defaultView.MouseEvent('click', { bubbles: true }));
            t('clique em filho do botão também dispara', parseFloat(agua.value) === antes + 10);
            clicar('aguaMenos');
        }
    }

    grupo('Helpers de tempo e moagem');
    t('1:30 → 90s', A.parseTimeToSeconds('1:30') === 90);
    t('90s → 1:30', A.formatTime(90) === '1:30');
    t('ida e volta do tempo', [0, 45, 75, 195, 585].every(s => A.parseTimeToSeconds(A.formatTime(s)) === s));
    t('13 cliques = Fina', A.clicksToGrindLevel(13) === 'Fina');
    t('18 cliques = Média-Fina', A.clicksToGrindLevel(18) === 'Média-Fina');
    t('30 cliques = Grossa', A.clicksToGrindLevel(30) === 'Grossa');

    fecharGrupo();
    grupoAtual = '';

    const placar = document.getElementById('placar');
    placar.className = fail === 0 ? 'verde' : 'vermelho';
    placar.textContent = fail === 0
        ? `✓ Todos os ${ok} testes passaram`
        : `✗ ${fail} de ${ok + fail} testes falharam`;
}
</script>
</body>
</html>
