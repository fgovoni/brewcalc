<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrewCalc — testes</title>
<style>
    body {
        margin: 0; padding: 24px; background: #1b1410; color: #f3e9dd;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
    }
    h1 { font-family: ui-serif, Georgia, serif; font-size: 22px; margin: 0 0 4px; }
    .sub { color: #a08b76; margin-bottom: 20px; font-size: 13px; }
    #placar { padding: 14px 16px; border-radius: 14px; font-weight: 700; margin-bottom: 18px; font-size: 16px; }
    .verde { background: rgba(124, 174, 111, 0.18); color: #9ed492; border: 1px solid #7cae6f; }
    .vermelho { background: rgba(224, 102, 74, 0.18); color: #ef8468; border: 1px solid #e0664a; }
    .grupo { margin-bottom: 6px; color: #e8be6e; font-weight: 700; margin-top: 16px; }
    .falha { color: #ef8468; padding-left: 14px; line-height: 1.5; }
    .resumo-grupo { color: #a08b76; padding-left: 14px; }
    pre { background: #221913; padding: 12px 14px; border-radius: 10px; color: #d8c6b3; overflow-x: auto; }
    iframe { display: none; }
</style>
</head>
<body>
<h1>BrewCalc — testes</h1>
<p class="sub">A lógica pura é importada direto dos módulos em <code>js/</code>. O que depende da tela
(ligação dos controles, cliques, regressão da dose do autor) roda contra o <code>index.html</code> real,
carregado no iframe. Precisa ser servido por http(s): módulo ES não abre por <code>file://</code>.</p>
<div id="placar">Carregando index.html…</div>
<div id="saida"></div>
<iframe id="app" src="index.html"></iframe>

<script type="module">
// Importa o que é puro sem passar pelo app: se um teste de cálculo quebrar, o
// problema está no módulo, não na tela.
import { escapeHtml, clicksToGrindLevel, formatTime, parseTimeToSeconds, formatRatio, clampToInput } from './js/formato.js';
import { renderRecipeSteps, getRecipeTemp, buildCustomRecipeObject, temMeta, normalizeCustomRecipe } from './js/receitas.js';
import { deviceData } from './js/receitas-dados.js';
import { toBase64Url, buildRecipeShareUrl, decodeRecipeFromParam, generateRecipeQR } from './js/compartilhar.js';
import { ajustarLegendaQR, LEGENDA_QR } from './js/cartao.js';

let ok = 0, fail = 0, grupoAtual = '', falhasDoGrupo = [], testesDoGrupo = 0;
const saida = document.getElementById('saida');

function grupo(nome) {
    fecharGrupo();
    grupoAtual = nome;
    falhasDoGrupo = [];
    testesDoGrupo = 0;
}

function fecharGrupo() {
    if (!grupoAtual) return;
    const el = document.createElement('div');
    el.className = 'grupo';
    el.textContent = (falhasDoGrupo.length === 0 ? '✓ ' : '✗ ') + grupoAtual + ` (${testesDoGrupo})`;
    saida.appendChild(el);
    falhasDoGrupo.forEach(f => {
        const d = document.createElement('div');
        d.className = 'falha';
        d.textContent = '↳ ' + f;
        saida.appendChild(d);
    });
}

function t(nome, cond, detalhe) {
    testesDoGrupo++;
    if (cond) { ok++; } else { fail++; falhasDoGrupo.push(nome + (detalhe ? ' :: ' + detalhe : '')); }
}

function mostrar(texto) {
    const pre = document.createElement('pre');
    pre.textContent = texto;
    saida.appendChild(pre);
}

async function iniciarBateria() {
    const w = document.getElementById('app').contentWindow;
    // Os testes de tela precisam do app carregado; window.BrewCalc é a superfície
    // que o app declara de propósito, porque escopo de módulo não é visível de fora.
    if (!w.BrewCalc) {
        document.getElementById('placar').className = 'vermelho';
        document.getElementById('placar').textContent =
            'window.BrewCalc não existe — o app não carregou. Confira o console do iframe.';
        return;
    }
    const API = {
        escapeHtml, clicksToGrindLevel, formatTime, parseTimeToSeconds, formatRatio,
        clampToInput, renderRecipeSteps, getRecipeTemp, buildCustomRecipeObject, temMeta,
        normalizeCustomRecipe, deviceData, toBase64Url, buildRecipeShareUrl,
        decodeRecipeFromParam, generateRecipeQR, ajustarLegendaQR, LEGENDA_QR,
    };
    // Sem isto uma exceção no meio da bateria interrompia tudo e o placar ficava
    // parado em "Carregando…" — parecia travamento, não falha.
    try {
        await rodar(API);
    } catch (e) {
        fecharGrupo();
        const placar = document.getElementById('placar');
        placar.className = 'vermelho';
        placar.textContent = `✗ a bateria abortou em "${grupoAtual}": ${e.message}`;
        mostrar(e.stack || String(e));
    }
}

// Este arquivo é módulo, e módulo é adiado: o iframe pode terminar de carregar
// ANTES desta linha rodar, e aí um addEventListener('load') puro nunca dispara —
// a bateria ficava parada em "Carregando…" de forma intermitente. Com script
// clássico a corrida não existia, porque ele executava durante o parse.
{
    const frame = document.getElementById('app');
    const jaCarregou = frame.contentDocument
        && frame.contentDocument.readyState === 'complete'
        && frame.contentWindow.BrewCalc;
    if (jaCarregou) iniciarBateria();
    else frame.addEventListener('load', iniciarBateria);
}

// Erro dentro do app (no iframe) não aparece aqui por padrão; sem isso um módulo
// que falha ao carregar viraria um teste vermelho sem explicação.
window.addEventListener('error', e => {
    if (e.filename && !e.filename.endsWith('tests.html')) mostrar('erro no app: ' + e.message + ' — ' + e.filename);
});

// Espera: sob tempo virtual do headless os timers adiantam, então isto não
// custa os segundos que aparenta.
const esperar = ms => new Promise(r => setTimeout(r, ms));

// Carrega uma instância nova do app numa URL específica — necessário para os
// fluxos que acontecem na inicialização, como importar receita vinda de link.
function carregarApp(url) {
    return new Promise((resolve, reject) => {
        const frame = document.createElement('iframe');
        frame.style.display = 'none';
        frame.src = url;
        frame.addEventListener('load', () => resolve(frame));
        frame.addEventListener('error', reject);
        document.body.appendChild(frame);
    });
}

async function rodar(A) {
    const todasReceitas = () => {
        const out = [];
        for (const dk of Object.keys(A.deviceData))
            for (const rk of Object.keys(A.deviceData[dk].recipes))
                out.push([dk, rk, A.deviceData[dk].recipes[rk]]);
        return out;
    };

    // ---------- Fidelidade: os despejos somam o alvo final ----------
    grupo('Soma dos despejos fecha no alvo, em toda receita e volume');
    for (const [dk, rk, receita] of todasReceitas()) {
        for (const water of [150, 200, 250, 300, 320, 333, 400, 500, 1000]) {
            const coffee = water / receita.ratio;
            const combos = receita.hasKasuyaControls
                ? [[1,1],[1,4],[2,2],[3,1],[3,2],[3,3],[3,4],[4,3],[5,1],[5,4]]
                : [[null, null]];
            for (const [bal, str] of combos) {
                const steps = A.renderRecipeSteps(receita.buildSteps(coffee, water, bal, str), coffee, water);
                const despejos = steps.filter(s => s.pour !== undefined);
                if (!despejos.length) continue;
                const soma = despejos.reduce((a, s) => a + s.pour, 0);
                const alvoFinal = despejos[despejos.length - 1].target;
                const rot = `${dk}/${rk} água=${water}${bal ? ` bal=${bal} força=${str}` : ''}`;
                t(`soma==alvo ${rot}`, soma === alvoFinal, `soma=${soma} alvo=${alvoFinal}`);
                let acc = 0, coerente = true;
                despejos.forEach(d => { acc += d.pour; if (acc !== d.target) coerente = false; });
                t(`alvos coerentes ${rot}`, coerente);
                t(`despejos não-negativos ${rot}`, despejos.every(d => d.pour >= 0));
                t(`alvo final == água ${rot}`, alvoFinal === Math.round(water), `alvo=${alvoFinal}`);
            }
        }
    }

    // O caso concreto que motivou a correção
    {
        const k = A.deviceData.v60.recipes.kasuya;
        const steps = A.renderRecipeSteps(k.buildSteps(250 / 15, 250, 3, 4), 250 / 15, 250);
        const d = steps.filter(s => s.pour !== undefined);
        const soma = d.reduce((a, s) => a + s.pour, 0);
        t('caso 250ml com 4 despejos soma 250g', soma === 250, `soma=${soma}`);
        mostrar('Kasuya · 250ml · equilibrado · 4 despejos de força\n' +
            d.map(s => `  despeje ${s.pour}g   →   alvo ${s.target}g`).join('\n') +
            `\n  soma dos despejos = ${soma}g`);
    }

    // ---------- Proporção ----------
    grupo('Proporção mantém o decimal e bate com a dose de referência');
    t('16.666… → 16.7', A.formatRatio(500 / 30) === '16.7', A.formatRatio(500 / 30));
    t('15 → 15 (sem .0)', A.formatRatio(15) === '15');
    t('380/24 → 15.8', A.formatRatio(380 / 24) === '15.8');
    t('200/11 → 18.2', A.formatRatio(200 / 11) === '18.2');
    t('200/18 → 11.1', A.formatRatio(200 / 18) === '11.1');
    for (const [dk, rk, r] of todasReceitas()) {
        if (!r.refDose) continue;
        t(`ratio == refDose ${dk}/${rk}`, Math.abs(r.ratio - r.refDose.water / r.refDose.coffee) < 1e-9);
    }

    grupo('Dose original do autor não se corrompe ao navegar');
    {
        // Regressão: getActiveRatio lia o valor EXIBIDO no campo (16.7) em vez da razão
        // exata da receita (16,6667), então a dose 30g/500ml do Hoffmann virava
        // 30g/501ml só de trocar de aparelho e voltar.
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        d.getElementById('device').value = 'v60'; w.BrewCalc.onDeviceChange();
        const antes = d.getElementById('water').value;
        ['chemex', 'kalita', 'aeropress', 'v60'].forEach(dev => {
            d.getElementById('device').value = dev; w.BrewCalc.onDeviceChange();
        });
        const depois = d.getElementById('water').value;
        t('água não muda ao ir e voltar de aparelho', antes === depois, `${antes} → ${depois}`);
        const cafe = parseFloat(d.getElementById('coffee').value);
        const exato = A.deviceData.v60.recipes.hoffmann.ratio;
        t('água == café × razão exata (não a exibida)', Math.abs(parseFloat(depois) - cafe * exato) < 0.5,
          `água=${depois} café=${cafe}`);
        t('dose do Hoffmann continua 30g/500ml', cafe === 30 && parseFloat(depois) === 500,
          `${cafe}g / ${depois}ml`);
    }

    grupo('Limites dos campos são respeitados');
    t('acima do max trava', A.clampToInput({ min: '5', max: '35' }, 99) === 35);
    t('abaixo do min trava', A.clampToInput({ min: '5', max: '35' }, 1) === 5);
    t('valor válido passa', A.clampToInput({ min: '5', max: '35' }, 20) === 20);
    t('sem max não trava', A.clampToInput({ min: '0', max: '' }, 1e6) === 1e6);

    // ---------- Temperatura ----------
    grupo('Temperatura preserva a faixa do autor e marca o que é ajuste do app');
    {
        const med = A.getRecipeTemp(A.deviceData.aeropress.recipes.hoffmann, 'medium');
        t('faixa 90–95 preservada', med.label === '90–95°C', med.label);
        t('faixa não é ajuste do app', med.adjusted === false);
        const kas = A.getRecipeTemp(A.deviceData.v60.recipes.kasuya, 'dark');
        t('temp por torra do autor', kas.value === 83 && kas.adjusted === false);
        t('ajuste por torra é marcado', A.getRecipeTemp(A.deviceData.v60.recipes.hoffmann, 'light').adjusted === true);
        t('temp base não é marcada como ajuste', A.getRecipeTemp(A.deviceData.v60.recipes.hoffmann, 'medium').adjusted === false);
    }

    // ---------- Segurança ----------
    grupo('escapeHtml neutraliza injeção');
    {
        const e = A.escapeHtml('<img src=x onerror="alert(1)">');
        t('sem <', !e.includes('<'));
        t('sem aspas duplas', !e.includes('"'));
        t('sem aspas simples', !A.escapeHtml("' onmouseover='x").includes("'"));
    }

    grupo('Importação por link rejeita payloads malformados');
    {
        const enc = o => A.toBase64Url(JSON.stringify(o));
        const bom = { n: 'Teste', dv: 'v60', rc: 20, rw: 320, ck: 18, tc: 93,
                      st: [[0, 50, 'Bloom'], [45, 320, 'Final']] };
        let passou = true;
        try { A.decodeRecipeFromParam(enc(bom)); } catch (e) { passou = false; }
        t('aceita payload válido', passou);

        const ruins = {
            'nome vazio': { n: '' }, 'nome gigante': { n: 'x'.repeat(200) },
            'nome não-string': { n: { a: 1 } }, 'sem passos': { st: [] },
            'passos demais': { st: Array(50).fill([0, 10, 'a']) }, 'st não-array': { st: 'nope' },
            'água zero': { rw: 0 }, 'café negativo': { rc: -5 }, 'temp absurda': { tc: 9999 },
            'cliques absurdos': { ck: 1e9 },
            'quantidade não numérica': { st: [[0, 'abc', 'Bloom']] },
            'descrição vazia': { st: [[0, 50, '']] },
            'descrição gigante': { st: [[0, 50, 'y'.repeat(200)]] },
            'passo incompleto': { st: [[0, 50]] },
            'tempo negativo': { st: [[-10, 50, 'Bloom']] },
        };
        for (const nome of Object.keys(ruins)) {
            let rejeitou = false;
            try { A.decodeRecipeFromParam(enc(Object.assign({}, bom, ruins[nome]))); }
            catch (e) { rejeitou = true; }
            t(`rejeita: ${nome}`, rejeitou);
        }
        // O payload de XSS real: se for aceito, precisa sair escapado, nunca como HTML vivo
        let dadosXss = null;
        try { dadosXss = A.decodeRecipeFromParam(enc(Object.assign({}, bom, { n: '<img src=x onerror=alert(1)>' }))); } catch (e) { /* rejeitado, ótimo */ }
        t('payload XSS rejeitado ou escapável', dadosXss === null || !A.escapeHtml(dadosXss.name).includes('<'));
    }

    // ---------- Compartilhamento ----------
    grupo('Link de compartilhamento é exato ao reescalar');
    {
        const data = { id: 'x', device: 'v60', name: 'Meu método', refCoffee: 20, refWater: 320,
                       clicksDefault: 18, tempC: 93,
                       steps: [{ time: '0:00', amount: 50, desc: 'Bloom' },
                               { time: '0:45', amount: 320, desc: 'Final' }] };
        const volta = A.decodeRecipeFromParam(A.buildRecipeShareUrl(data).param);
        t('nome sobrevive', volta.name === data.name);
        t('água de referência sobrevive', volta.refWater === 320);
        t('quantidade exata sobrevive', volta.steps[0].amount === 50, String(volta.steps[0].amount));
        const escalado = Math.round(400 * (volta.steps[0].amount / volta.refWater));
        t('50g/320ml reescalado a 400ml dá 63g (não 62)', escalado === 63, `deu ${escalado}`);
        t('tempos sobrevivem', volta.steps[1].time === '0:45', volta.steps[1].time);
    }

    grupo('Migração do formato antigo salvo no navegador');
    {
        const novo = A.normalizeCustomRecipe({ refWater: 320, steps: [{ time: '0:00', pct: 0.15625, desc: 'Bloom' }] });
        t('pct vira gramas absolutos', novo.steps[0].amount === 50, String(novo.steps[0].amount));
    }

    grupo('Meta em gramas é opcional no passo customizado');
    {
        // Regressão: o commit 2c4d23a reverteu em silêncio a meta opcional, exigindo
        // gramas em todo passo — inclusive nos que são só instrução ("aguarde a drenagem").
        t('temMeta aceita número positivo', A.temMeta(50) === true);
        t('temMeta rejeita null', A.temMeta(null) === false);
        t('temMeta rejeita zero', A.temMeta(0) === false);
        t('temMeta rejeita texto', A.temMeta('50') === false);

        const receita = {
            id: 'x', device: 'v60', name: 'Com instrução', refCoffee: 20, refWater: 320,
            clicksDefault: 18, tempC: 93,
            steps: [{ time: '0:00', amount: 50, desc: 'Bloom' },
                    { time: '0:45', amount: 320, desc: 'Despejo final' },
                    { time: '2:00', amount: null, desc: 'Aguarde a drenagem' }]
        };
        const obj = A.buildCustomRecipeObject(receita);
        const passos = A.renderRecipeSteps(obj.buildSteps(20, 320), 20, 320);
        t('passo sem meta não vira despejo', passos[2].pour === undefined, JSON.stringify(passos[2]));
        t('passo sem meta mantém a descrição', /Aguarde a drenagem/.test(passos[2].desc), passos[2].desc);
        t('passos com meta seguem somando o alvo',
            passos[0].pour + passos[1].pour === passos[1].target,
            `${passos[0].pour}+${passos[1].pour} vs ${passos[1].target}`);

        // Migração do formato antigo: pct null virava meta obrigatória
        const migrado = A.normalizeCustomRecipe({
            refWater: 320,
            steps: [{ time: '0:00', pct: 0.15625, desc: 'Bloom' }, { time: '2:00', pct: null, desc: 'Aguarde' }]
        });
        t('migração preserva passo sem meta', migrado.steps[1].amount === null, String(migrado.steps[1].amount));
        t('migração converte passo com meta', migrado.steps[0].amount === 50, String(migrado.steps[0].amount));
    }

    grupo('QR comporta receitas de tamanho realista');
    {
        // Regressão: o gerador parava na versão 10 (271 bytes) e falhava a partir de
        // 4 passos — ou seja, em qualquer receita de verdade.
        const receita = n => ({
            id: 'x', device: 'v60', name: 'Receita de domingo de manhã', refCoffee: 20, refWater: 320,
            clicksDefault: 18, tempC: 93,
            steps: Array.from({ length: n }, (_, i) => ({
                time: `${i}:00`, amount: 50 + i * 45, desc: `Despejo número ${i + 1} em espiral`
            }))
        });
        for (const n of [3, 4, 6, 8]) {
            const { url } = A.buildRecipeShareUrl(receita(n));
            t(`receita de ${n} passos gera QR (${url.length} bytes)`, !!A.generateRecipeQR(url));
        }
        // Ida e volta pelo link continua exata
        const { url } = A.buildRecipeShareUrl(receita(6));
        const volta = A.decodeRecipeFromParam(url.split('#r=')[1]);
        t('receita de 6 passos volta íntegra do link', volta.steps.length === 6 && volta.steps[0].amount === 50);
    }

    // ---------- Ligação dos controles ----------
    // Antes os handlers eram onclick inline, que não dá para enumerar: errar o nome de
    // uma função deixava o botão morto sem nenhum teste reclamar. Com o mapa ACOES dá
    // para varrer todo controle declarado no HTML e conferir que ele resolve.
    grupo('Todo controle do HTML resolve para uma função');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const controles = d.querySelectorAll('[data-acao], [data-entrada], [data-mudanca]');
        // Um mesmo elemento pode declarar mais de uma ação — #ratio-input reage a input
        // e a change com funções diferentes — então são todos os atributos, não o primeiro.
        const acoesDe = el => [el.dataset.acao, el.dataset.entrada, el.dataset.mudanca].filter(Boolean);
        t('o HTML declara controles', controles.length >= 40, `achei ${controles.length}`);
        controles.forEach(el => acoesDe(el).forEach(nome => {
            t(`ação "${nome}" existe`, typeof w.BrewCalc.ACOES[nome] === 'function');
        }));
        // O caminho inverso: ação no mapa sem nenhum controle no HTML é código morto,
        // ou pior, sinal de que alguém renomeou o atributo e esqueceu do mapa.
        const usados = new Set(Array.from(controles).flatMap(acoesDe));
        Object.keys(w.BrewCalc.ACOES).forEach(nome => {
            // avaliacaoNota e removerPasso vivem em elementos criados em runtime
            if (nome === 'avaliacaoNota' || nome === 'removerPasso') return;
            t(`ação "${nome}" é usada por algum controle`, usados.has(nome));
        });
        t('sobrou onclick inline no HTML', !/\son(click|input|change)=/.test(d.documentElement.outerHTML));
    }

    // Resolver o nome no mapa não prova que o clique chega lá: a delegação em si pode
    // estar quebrada (listener não registrado, closest errado, evento que não borbulha).
    // Estes clicam de verdade e conferem o efeito no DOM.
    grupo('Clique de verdade atravessa a delegação');
    {
        const d = document.getElementById('app').contentDocument;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new d.defaultView.MouseEvent('click', { bubbles: true }));

        const agua = d.getElementById('water');
        const antes = parseFloat(agua.value);
        clicar('aguaMais');
        t('clique em + soma 10ml', parseFloat(agua.value) === antes + 10, `${antes} → ${agua.value}`);
        clicar('aguaMenos');
        t('clique em − devolve ao valor original', parseFloat(agua.value) === antes, agua.value);

        clicar('abaAvaliacao');
        t('clique troca para a aba de avaliação',
            d.getElementById('tab-btn-review').getAttribute('aria-selected') === 'true');
        clicar('abaCalculadora');
        t('clique volta para a calculadora',
            d.getElementById('tab-btn-calc').getAttribute('aria-selected') === 'true');

        // Calcular a receita atravessa app -> estado -> receitas -> timer. É o caminho
        // que mais módulos cruza, e o único jeito de perceber um import quebrado entre
        // eles sem abrir o app na mão.
        clicar('calcularReceita');
        const container = d.getElementById('recipe-container');
        t('calcular revela a receita', !container.classList.contains('hidden'));
        const passos = container.querySelectorAll('.step-time');
        t('a receita sai com passos', passos.length > 0, `${passos.length} passos`);
        // O painel do timer nasce escondido e só initTimerForSteps o revela — é o que
        // prova que o app chegou até o módulo do timer, e não só renderizou a receita.
        t('o painel do timer foi revelado',
            !d.getElementById('timer-panel').classList.contains('hidden'));

        // O botão tem um <span> dentro em alguns temas; o clique nasce no filho e só
        // chega à ação via closest. Cobre justamente esse caminho.
        const alvoFilho = d.querySelector('[data-acao="aguaMais"]').firstChild;
        if (alvoFilho && alvoFilho.nodeType === 1) {
            alvoFilho.dispatchEvent(new d.defaultView.MouseEvent('click', { bubbles: true }));
            t('clique em filho do botão também dispara', parseFloat(agua.value) === antes + 10);
            clicar('aguaMenos');
        }
    }

    // Este é o caminho que deixou passar uma regressão: salvar a receita gravava no
    // localStorage mas não repopulava o seletor, e só aparecia ao recarregar a página.
    // Nenhum teste criava receita pela interface — todos usavam as funções direto.
    grupo('Criar receita pela interface faz ela aparecer no seletor');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
        const mudar = el => el.dispatchEvent(new w.Event('change', { bubbles: true }));

        const nome = 'Receita de teste ' + Date.now();
        const seletor = d.getElementById('recipe');
        const antes = seletor.options.length;

        // Abre o construtor pela opção "criar" do próprio seletor, como o usuário faz
        seletor.value = '__custom_new__';
        mudar(seletor);
        t('o construtor abriu', !d.getElementById('recipe-builder-card').classList.contains('hidden'));

        // O construtor já abre com três passos preenchidos a partir da água atual,
        // então o usuário só precisa dar um nome — é esse o caminho mínimo real.
        t('o construtor já vem com passos', d.querySelectorAll('.custom-step-row').length === 3,
          `${d.querySelectorAll('.custom-step-row').length} passos`);
        d.getElementById('custom-name').value = nome;

        clicar('salvarReceita');

        const erro = d.getElementById('custom-recipe-error');
        t('salvou sem erro de validação', erro.classList.contains('hidden'), erro.textContent);
        t('o construtor fechou', d.getElementById('recipe-builder-card').classList.contains('hidden'));

        const nomes = Array.from(seletor.options).map(o => o.textContent);
        t('a receita aparece no seletor SEM recarregar', nomes.some(n => n.includes(nome)),
          `opções: ${nomes.join(' | ')}`);
        t('o seletor cresceu', seletor.options.length > antes, `${antes} → ${seletor.options.length}`);
        t('a receita nova fica selecionada',
          Array.from(seletor.selectedOptions).some(o => o.textContent.includes(nome)));

        // Limpa o que o teste criou, para não poluir o localStorage de quem rodou
        const criada = Array.from(seletor.options).find(o => o.textContent.includes(nome));
        if (criada) {
            seletor.value = criada.value;
            mudar(seletor);
            w.confirm = () => true;   // deleteCustomRecipe pede confirmação
            clicar('excluirReceita');
            const restantes = Array.from(seletor.options).map(o => o.textContent);
            t('excluir some com a receita do seletor', !restantes.some(n => n.includes(nome)));
        }
    }

    // ---------- Fluxos de ponta a ponta ----------
    // Os testes acima exercitam funções; estes exercitam caminhos. A distinção não é
    // academica: a regressão do seletor passou por 799 testes verdes porque nenhum
    // percorria o caminho do usuário, só chamava as funções que ele aciona.

    grupo('Importar receita vinda de link');
    {
        // O caminho do QR inteiro: um link com a receita embutida abre o app, mostra a
        // confirmação e só grava depois do aceite. Roda numa instância nova porque
        // checkImportFromUrl só acontece na inicialização.
        const receita = {
            id: 'teste-import-' + Date.now(), device: 'v60', name: 'Vinda por link',
            refCoffee: 20, refWater: 320, clicksDefault: 18, tempC: 93,
            steps: [{ time: '0:00', amount: 50, desc: 'Bloom' },
                    { time: '0:45', amount: 320, desc: 'Final' }],
        };
        const { param } = A.buildRecipeShareUrl(receita);

        const frame = await carregarApp('index.html#r=' + param);
        const d = frame.contentDocument;
        const w = frame.contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

        t('o app abriu pedindo confirmação',
            !d.getElementById('import-overlay').classList.contains('hidden'));
        t('a confirmação mostra o nome da receita',
            d.getElementById('import-recipe-desc').textContent.includes('Vinda por link'),
            d.getElementById('import-recipe-desc').textContent);
        t('nada foi gravado antes do aceite',
            !Array.from(d.getElementById('recipe').options).some(o => o.textContent.includes('Vinda por link')));

        clicar('confirmarImportacao');

        t('o diálogo fechou', d.getElementById('import-overlay').classList.contains('hidden'));
        const nomes = Array.from(d.getElementById('recipe').options).map(o => o.textContent);
        t('a receita entrou no seletor', nomes.some(n => n.includes('Vinda por link')), nomes.join(' | '));
        t('a receita importada fica selecionada',
            Array.from(d.getElementById('recipe').selectedOptions).some(o => o.textContent.includes('Vinda por link')));
        t('o hash foi limpo da barra de endereço', !w.location.hash.includes('#r='), w.location.hash);

        // Limpa: a receita foi gravada no localStorage compartilhado
        w.confirm = () => true;
        clicar('excluirReceita');
        frame.remove();
    }

    grupo('Ignorar a importação não grava nada');
    {
        const receita = {
            id: 'teste-ignora-' + Date.now(), device: 'v60', name: 'Recusada',
            refCoffee: 20, refWater: 320, clicksDefault: 18, tempC: 93,
            steps: [{ time: '0:00', amount: 50, desc: 'Bloom' }],
        };
        const { param } = A.buildRecipeShareUrl(receita);
        const frame = await carregarApp('index.html#r=' + param);
        const d = frame.contentDocument, w = frame.contentWindow;
        d.querySelector('[data-acao="ignorarImportacao"]')
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

        t('o diálogo fechou', d.getElementById('import-overlay').classList.contains('hidden'));
        t('a receita recusada não entrou no seletor',
            !Array.from(d.getElementById('recipe').options).some(o => o.textContent.includes('Recusada')));
        // Conferir só o seletor não bastava: recusar não repopula o seletor, então a
        // receita podia estar gravada e o teste passaria assim mesmo. O que importa é
        // não ter ido para o armazenamento.
        t('a receita recusada não foi gravada',
            !(w.localStorage.getItem('brewcalc-custom-recipes') || '').includes('Recusada'),
            w.localStorage.getItem('brewcalc-custom-recipes'));
        frame.remove();
    }

    grupo('Link corrompido não abre diálogo nem quebra o app');
    {
        const frame = await carregarApp('index.html#r=isto-nao-e-base64-valido!!');
        const d = frame.contentDocument;
        t('nenhum diálogo de importação', d.getElementById('import-overlay').classList.contains('hidden'));
        t('o app carregou normalmente', !!frame.contentWindow.BrewCalc);
        t('o seletor tem as receitas oficiais', d.getElementById('recipe').options.length >= 2);
        frame.remove();
    }

    grupo('Editar receita existente preserva os dados');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
        const mudar = el => el.dispatchEvent(new w.Event('change', { bubbles: true }));
        const seletor = d.getElementById('recipe');

        const nome = 'Para editar ' + Date.now();
        seletor.value = '__custom_new__';
        mudar(seletor);
        d.getElementById('custom-name').value = nome;
        d.getElementById('custom-ref-water').value = '400';
        clicar('salvarReceita');

        clicar('editarReceita');
        t('o construtor reabriu', !d.getElementById('recipe-builder-card').classList.contains('hidden'));
        t('o nome veio preenchido', d.getElementById('custom-name').value === nome,
          d.getElementById('custom-name').value);
        t('a água de referência veio preenchida',
          parseFloat(d.getElementById('custom-ref-water').value) === 400,
          d.getElementById('custom-ref-water').value);
        t('os passos vieram preenchidos', d.querySelectorAll('.custom-step-row').length === 3,
          `${d.querySelectorAll('.custom-step-row').length}`);

        // Editar e salvar não deve duplicar a receita
        const antes = seletor.options.length;
        d.getElementById('custom-name').value = nome + ' v2';
        clicar('salvarReceita');
        t('editar não duplica a receita', seletor.options.length === antes,
          `${antes} → ${seletor.options.length}`);
        t('o nome novo aparece',
          Array.from(seletor.options).some(o => o.textContent.includes(nome + ' v2')));

        w.confirm = () => true;
        clicar('excluirReceita');
    }

    grupo('Cancelar o construtor volta para uma receita real');
    {
        // Este caminho passa pelo callback de redesenho SEM deviceKey — o ramo que
        // repopula nada e só atualiza. Era o único do callback nunca executado.
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const seletor = d.getElementById('recipe');
        seletor.value = '__custom_new__';
        seletor.dispatchEvent(new w.Event('change', { bubbles: true }));
        t('o construtor abriu', !d.getElementById('recipe-builder-card').classList.contains('hidden'));

        // Sujar a tela de propósito: só o redesenho disparado pelo cancelar repõe
        // estes valores. Sem isso o teste passava mesmo com o callback desligado,
        // porque fechar o construtor e mexer no seletor o próprio cancelar já faz.
        d.getElementById('water').value = '9999';
        d.getElementById('recipe-note').textContent = 'LIXO';

        d.querySelector('[data-acao="cancelarReceita"]')
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
        t('o construtor fechou', d.getElementById('recipe-builder-card').classList.contains('hidden'));
        t('o seletor saiu de "criar"', seletor.value !== '__custom_new__', seletor.value);
        t('voltou a mostrar os campos da receita oficial',
            !d.getElementById('official-recipe-fields').classList.contains('hidden'));
        t('a tela foi redesenhada: a água voltou ao valor da receita',
            d.getElementById('water').value !== '9999', d.getElementById('water').value);
        t('a tela foi redesenhada: a nota da receita voltou',
            d.getElementById('recipe-note').textContent !== 'LIXO',
            d.getElementById('recipe-note').textContent.slice(0, 40));
    }

    grupo('Timer: contagem regressiva, andamento e zerar');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

        clicar('calcularReceita');
        const botao = d.getElementById('timer-start-btn');
        const display = d.getElementById('timer-display');
        t('o timer começa zerado', display.textContent === '0:00', display.textContent);
        t('o botão começa em Iniciar', botao.textContent === 'Iniciar', botao.textContent);

        clicar('alternarTimer');
        t('entra em contagem regressiva', display.textContent === '3', display.textContent);
        t('o botão trava durante a contagem', botao.disabled === true);

        await esperar(3400);
        t('depois da contagem o timer está rodando', botao.textContent !== 'Iniciar', botao.textContent);
        t('o botão destrava', botao.disabled === false);
        t('o display voltou ao formato de tempo', /^\d+:\d\d$/.test(display.textContent),
          display.textContent);

        // Precisa avançar de verdade antes de zerar: se o display continuar em 0:00,
        // a asserção do zerar passa sem provar nada — foi o que a mutação mostrou.
        await esperar(2200);
        t('o tempo avança enquanto roda', display.textContent !== '0:00', display.textContent);

        clicar('zerarTimer');
        t('zerar volta o display para 0:00', display.textContent === '0:00', display.textContent);
        t('zerar volta o botão para Iniciar', botao.textContent === 'Iniciar', botao.textContent);
    }

    grupo('Proporção: ajustar, restaurar a oficial');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

        d.getElementById('device').value = 'v60';
        d.getElementById('device').dispatchEvent(new w.Event('change', { bubbles: true }));
        const campo = d.getElementById('ratio-input');
        const oficial = campo.value;

        clicar('razaoMais');
        t('ajustar muda a proporção exibida', campo.value !== oficial, `${oficial} → ${campo.value}`);
        const botaoOficial = d.getElementById('ratio-official-btn');
        t('o atalho para a proporção oficial aparece', !botaoOficial.classList.contains('hidden'));

        clicar('razaoOficial');
        t('restaurar volta ao valor oficial', campo.value === oficial, `${campo.value} vs ${oficial}`);
        t('o atalho some depois de restaurar', botaoOficial.classList.contains('hidden'));

        // A proporção ajustada precisa sobreviver à troca de receita — foi bug antes
        clicar('razaoMenos');
        const ajustada = campo.value;
        ['chemex', 'v60'].forEach(dev => {
            d.getElementById('device').value = dev;
            d.getElementById('device').dispatchEvent(new w.Event('change', { bubbles: true }));
        });
        t('a proporção ajustada sobrevive à troca de aparelho', campo.value === ajustada,
          `${ajustada} → ${campo.value}`);
        clicar('razaoOficial');
    }

    grupo('Steppers mexem no campo certo');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

        for (const [mais, menos, campo, passo] of [
            ['tempMais', 'tempMenos', 'temp-input', 1],
            ['cliquesMais', 'cliquesMenos', 'clicks-input', 1],
            ['cafeMais', 'cafeMenos', 'coffee', 1],
        ]) {
            const el = d.getElementById(campo);
            const antes = parseFloat(el.value);
            clicar(mais);
            t(`${mais} soma ${passo}`, parseFloat(el.value) === antes + passo,
              `${antes} → ${el.value}`);
            clicar(menos);
            t(`${menos} devolve ao valor original`, parseFloat(el.value) === antes, el.value);
        }
    }

    grupo('Trocar aparelho e torra redesenha a receita');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const mudar = id => d.getElementById(id).dispatchEvent(new w.Event('change', { bubbles: true }));

        d.getElementById('device').value = 'aeropress';
        mudar('device');
        t('trocar de aparelho troca as receitas do seletor',
          Array.from(d.getElementById('recipe').options).length > 0);
        t('a nota da receita acompanha', d.getElementById('recipe-note').textContent.length > 0);

        const tempAntes = d.getElementById('temp-input').value;
        d.getElementById('roast').value = 'dark';
        mudar('roast');
        t('trocar a torra ajusta a temperatura', d.getElementById('temp-input').value !== tempAntes,
          `${tempAntes} → ${d.getElementById('temp-input').value}`);

        d.getElementById('device').value = 'v60';
        mudar('device');
        d.getElementById('roast').value = 'medium';
        mudar('roast');
    }

    grupo('Gerar a imagem do cartão');
    {
        // Atravessa app -> cartao -> compartilhar -> qr, a cadeia mais longa do app.
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const clicar = acao => d.querySelector(`[data-acao="${acao}"]`)
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));

        clicar('abaAvaliacao');
        d.getElementById('coffee-name').value = 'Café de teste';
        clicar('gerarImagem');

        t('a prévia aparece', !d.getElementById('share-preview').classList.contains('hidden'));
        const canvas = d.getElementById('share-canvas');
        t('o cartão tem o tamanho de Stories', canvas.width === 1080 && canvas.height === 1920,
          `${canvas.width}x${canvas.height}`);

        // Contar cores, não bytes: um PNG de 1080x1920 em branco ainda passa de 5KB de
        // dataURL, então tamanho não distingue "desenhou" de "não desenhou". Canvas
        // intocado tem uma cor só; o cartão tem fundo em gradiente, texto e o QR.
        const pixels = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
        const cores = new Set();
        for (let i = 0; i < pixels.length; i += 4 * 997) {
            cores.add(`${pixels[i]},${pixels[i + 1]},${pixels[i + 2]},${pixels[i + 3]}`);
        }
        t('o cartão foi realmente desenhado', cores.size > 5, `${cores.size} cores distintas`);
        clicar('abaCalculadora');
    }

    grupo('Alternar o tema e persistir a escolha');
    {
        const d = document.getElementById('app').contentDocument;
        const w = document.getElementById('app').contentWindow;
        const antes = d.documentElement.getAttribute('data-theme');
        d.querySelector('[data-acao="alternarTema"]')
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
        const depois = d.documentElement.getAttribute('data-theme');
        t('o tema muda', depois !== antes, `${antes} → ${depois}`);
        t('a escolha é gravada', w.localStorage.getItem('brewcalc-theme') === depois,
          w.localStorage.getItem('brewcalc-theme'));
        d.querySelector('[data-acao="alternarTema"]')
            .dispatchEvent(new w.MouseEvent('click', { bubbles: true }));
        t('volta ao tema original', d.documentElement.getAttribute('data-theme') === antes);
    }

    grupo('A legenda do QR cabe dentro do painel');
    {
        // Regressão: o painel era dimensionado só pelo QR (lado + 120). Quando sobrava
        // pouco espaço vertical o QR encolhia, e a legenda — de largura fixa — passava
        // a ser mais larga que o quadro, vazando pelas laterais do cartão.
        const ctx = document.createElement('canvas').getContext('2d');
        const W = 1080;
        const larguraDo = (texto, fonte) => {
            ctx.font = `700 ${fonte}px system-ui, sans-serif`;
            return ctx.measureText(texto).width;
        };
        for (const ladoQR of [180, 240, 320, 430, 600]) {
            const { fonte, panelW } = A.ajustarLegendaQR(ctx, A.LEGENDA_QR, ladoQR, W);
            const larguraTexto = larguraDo(A.LEGENDA_QR, fonte);
            t(`QR de ${ladoQR}px: a legenda cabe no painel`, larguraTexto <= panelW,
              `texto=${Math.round(larguraTexto)} painel=${panelW}`);
            t(`QR de ${ladoQR}px: o painel cabe no cartão`, panelW <= W - 80, `painel=${panelW}`);
            t(`QR de ${ladoQR}px: o QR cabe no painel`, ladoQR <= panelW,
              `qr=${ladoQR} painel=${panelW}`);
        }
        // A fonte só cede quando precisa: em cartão largo ela fica no corpo cheio
        t('mantém 28px quando há espaço', A.ajustarLegendaQR(ctx, A.LEGENDA_QR, 430, W).fonte === 28);
    }

    grupo('Helpers de tempo e moagem');
    t('1:30 → 90s', A.parseTimeToSeconds('1:30') === 90);
    t('90s → 1:30', A.formatTime(90) === '1:30');
    t('ida e volta do tempo', [0, 45, 75, 195, 585].every(s => A.parseTimeToSeconds(A.formatTime(s)) === s));
    t('13 cliques = Fina', A.clicksToGrindLevel(13) === 'Fina');
    t('18 cliques = Média-Fina', A.clicksToGrindLevel(18) === 'Média-Fina');
    t('30 cliques = Grossa', A.clicksToGrindLevel(30) === 'Grossa');

    fecharGrupo();
    grupoAtual = '';

    const placar = document.getElementById('placar');
    placar.className = fail === 0 ? 'verde' : 'vermelho';
    placar.textContent = fail === 0
        ? `✓ Todos os ${ok} testes passaram`
        : `✗ ${fail} de ${ok + fail} testes falharam`;
}
</script>
</body>
